<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>所有課程 | NTUE Noodle</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
    
    <link rel="icon" href="image/noodle-favicon.jpg" type="image/jpeg">
    <link rel="shortcut icon" href="image/noodle-favicon.jpg" type="image/jpeg">
</head>
<body>

    <header class="navbar navbar-expand-lg navbar-light bg-light sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="dashboard.html">
                <img src="image/noodle-logo.png" alt="NTUE Logo" height="40">
                <span class="ms-2 fw-bold">Noodle 教學平台</span>
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#main-nav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="main-nav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" href="dashboard.html">首頁</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active fw-bold text-primary" aria-current="page" href="all-course.html">所有課程</a>
                    </li>
                </ul>

                <div class="d-flex align-items-center ms-lg-3 me-3">
                    <i class="bi bi-sun-fill theme-icon-active" id="theme-icon-sun"></i>
                    <div class="form-check form-switch mx-1">
                        <input class="form-check-input" type="checkbox" role="switch" id="theme-switch">
                    </div>
                    <i class="bi bi-moon-fill" id="theme-icon-moon"></i>
                </div>

                <ul class="navbar-nav">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle d-flex align-items-center" href="#" id="user-menu" role="button" data-bs-toggle="dropdown">
                            <i class="bi bi-person-circle fs-4 me-2"></i>
                            <span>載入中...</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="#">瀏覽個人資料</a></li>
                            <li><a class="dropdown-item" href="#">成績</a></li>
                            <li><a class="dropdown-item" href="#">偏好設定</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="import-tool.html"><i class="bi bi-gear-fill me-2"></i>後台工具</a></li>
                            <li><a class="dropdown-item" href="#">登出</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </header>

    <main class="container my-5">
        
        <div class="row align-items-center mb-4">
            <div class="col-md-4">
                <h2 class="fw-bold mb-0">所有課程列表</h2>
            </div>
            <div class="col-md-8">
                <form class="row g-2 justify-content-md-end">
                    <div class="col-auto">
                        <select class="form-select" id="filter-semester">
                            <option selected value="all">所有學期</option>
                            <option value="114-1">114學年度 第1學期</option>
                            <option value="113-2">113學年度 第2學期</option>
                        </select>
                    </div>
                    <div class="col-auto">
                        <select class="form-select" id="filter-type">
                            <option selected value="all">所有分類</option>
                            <option value="必修">必修</option>
                            <option value="選修">選修</option>
                            <option value="通識">通識</option>
                        </select>
                    </div>
                    <div class="col-auto">
                        <div class="input-group">
                            <input type="text" class="form-control" id="search-input" placeholder="搜尋課程名稱...">
                            <button class="btn btn-primary" type="button" id="search-btn"><i class="bi bi-search"></i></button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <hr class="mb-5">

        <div id="course-list-container" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
            <div class="col-12 text-center py-5">
                <div class="spinner-border text-primary" role="status"></div>
                <p class="mt-2 text-muted">正在載入課程...</p>
            </div>
        </div>

        <nav aria-label="Page navigation" class="mt-5">
            <ul class="pagination justify-content-center">
                <li class="page-item disabled"><a class="page-link" href="#">上一頁</a></li>
                <li class="page-item active"><a class="page-link" href="#">1</a></li>
                <li class="page-item"><a class="page-link" href="#">下一頁</a></li>
            </ul>
        </nav>

    </main>

    <footer class="bg-dark text-white mt-5">
        <div class="container py-4">
            <div class="row">
                <div class="col-md-6 text-center text-md-start">
                    <p class="mb-0">© 2025 Raaay. All rights reserved.</p>
                    <small>本網站為課程前端工程設計Redesign作品，原Moodle平台的設計太反人類。</small>
                </div>
                <div class="col-md-6 text-center text-md-end">
                    <a href="https://www.ntue.edu.tw/" class="text-white me-3">校首頁</a>
                    <a href="#" class="text-white">校園入口網</a>
                </div>
            </div>
        </div>
    </footer>

    <a id="back-to-top-btn" href="#top" aria-label="Back to top">↑</a>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script type="module" src="js/firebase-auth.js"></script>
    <script src="js/main.js"></script>
    
    <script type="module" src="js/firebase-all-course.js"></script>
    
</script>
</body>
</html>
