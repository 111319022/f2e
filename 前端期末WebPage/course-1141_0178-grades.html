            <div class="col-lg-8">
                <h1 class="display-6 fw-bold mb-4">我的成績</h1>

                <div class="card mb-4 bg-primary text-white border"
                    style="transform: none !important; transition: none !important; box-shadow: none !important;">
                    <div class="card-body text-center p-4">
                        <h2 class="display-1 fw-bold" id="total-score-display">--</h2>
                        <p class="fs-5">目前預估總成績</p>
                    </div>
                </div>

                                    <th>比重</th>

                                    <th>評語</th>

                            <tbody id="grades-list">
                                <tr>
