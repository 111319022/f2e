<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登入 | NTUE Noodle</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
   
        body, html {
            height: 100%;
        }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--bg-color);
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 2rem;
            border-radius: 1rem;
            background-color: var(--surface-color, #fff);
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="d-flex justify-content-center">
            <div class="login-card">
                <img src="image/ntue_logo.png" alt="NTUE Logo" width="80" class="mb-4">
                <h2 class="h3 fw-bold mb-3">歡迎來到 Noodle</h2>
                <p class="text-muted mb-4">請使用學校 Google 帳號登入以繼續</p>
                
                <button id="google-login-btn" class="btn btn-primary w-100 py-2 d-flex align-items-center justify-content-center">
                    <i class="bi bi-google me-2"></i> 使用 Google 登入
                </button>
                
                <div class="mt-4 text-muted small">
                    &copy; 2025 Raaay. All rights reserved.
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="js/firebase-auth.js"></script>
</body>
</html>
