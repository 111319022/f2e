    <!DOCTYPE html>
    <html lang="zh-Hant">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>登入 | NTUE Noodle</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
        <link rel="stylesheet" href="css/style.css">
        <style>
            body, html {
                height: 100%;
                overflow: hidden; /* 防止出現不必要的捲軸 */
            }
            
            /* 左側公告區背景色 */
            .announcement-section {
                background-color: #f8f9fa; /* 淺灰底色，區隔視覺 */
                border-right: 1px solid #dee2e6;
            }

            /* 公告列表最大高度，超過自動捲動 */
            .scrollable-list {
                max-height: 70vh;
                overflow-y: auto;
            }

            .login-card {
                width: 100%;
                max-width: 400px;
                padding: 2rem;
                border-radius: 1rem;
                background-color: var(--surface-color, #fff);
                box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
                text-align: center;
            }
        </style>
    </head>
    <body>

        <div class="container-fluid h-100">
            <div class="row h-100">
                
                <div class="col-lg-7 d-flex flex-column justify-content-center p-5 announcement-section">
                    <div class="container" style="max-width: 800px;">
                        <h2 class="display-6 fw-bold mb-4 text-primary">
                            <i class="bi bi-megaphone-fill me-2"></i>最新公告
                        </h2>
                        <p class="text-muted mb-4">嗨！看一下我</p>

                        <div id="announcement-list" class="list-group shadow-sm scrollable-list">
                            <div class="text-center text-muted py-3">
                                <div class="spinner-border spinner-border-sm" role="status"></div>
                                載入中...
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-lg-5 d-flex align-items-center justify-content-center bg-white">
                    <div class="login-card mx-3">
                        <img src="image/ntue_logo.png" alt="NTUE Logo" width="80" class="mb-4">
                        <h2 class="h3 fw-bold mb-3">歡迎來到 Noodle</h2>
                        <p class="text-muted mb-4">請使用學校 Google 帳號登入以繼續</p>
                        
                        <button id="google-login-btn" class="btn btn-primary w-100 py-2 d-flex align-items-center justify-content-center">
                            <i class="bi bi-google me-2"></i> 使用 Google 登入
                        </button>
                        
                        <div class="mt-4 text-muted small">
                            &copy; 2025 Raaay. All rights reserved.
                        </div>
                    </div>
                </div>

            </div>
        </div>
 <!-- 公告彈窗 -->
        <div class="modal fade" id="announcementModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg"> <div class="modal-content">
            <div class="modal-header bg-light">
                <h5 class="modal-title fw-bold" id="modal-title">公告標題載入中...</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-4">
                <div class="d-flex align-items-center mb-4 text-muted border-bottom pb-3">
                    <i class="bi bi-person-circle me-2"></i>
                    <span id="modal-author" class="me-3">作者</span>
                    <i class="bi bi-calendar3 me-2"></i>
                    <span id="modal-date">日期</span>
                    <span id="modal-tag" class="ms-auto badge bg-secondary">標籤</span>
                </div>
                
                <div id="modal-content" style="white-space: pre-wrap; line-height: 1.8;">
                    </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">關閉</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script type="module" src="js/firebase-data.js"></script>
        
        <script type="module" src="js/firebase-auth.js"></script>
    </body>
    </html>
